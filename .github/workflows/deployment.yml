name: Publish on GitHub Pages

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup Typst
        uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5.2.0

      # Cache key is a short sha256 over the expected checksums hardcoded in
      # scripts/fetch-og-fonts.sh (`expected_sha256`). If you repin the fonts
      # (change `noto_cjk_commit` and the checksums in that script), you must
      # also change this key so CI doesn't keep serving a stale cache entry.
      - name: Cache OG image fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: og/fonts
          key: og-fonts-c455afefd10b

      - name: Generate OG images
        run: ./scripts/generate-og-images.sh

      - name: Build Zola + upload Pages artifact
        uses: lemonadern/zola-github-pages@ec083855bf870ef6d3c0c8b2e8a26a1e0c79f2ae # v1.0.0
        with:
          zola_version: v0.22.1

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
